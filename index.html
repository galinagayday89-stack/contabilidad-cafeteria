<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contabilidad Cafetería</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="author" content="Halyna Haidai (Галина Гайдай) · ai.lab.creative">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra lateral azul cobalto con azulejos valencianos + área de trabajo crema con tarjetas; naranja como acento */
:root{
  --bg:#f6f1e7; --surface:#fffdf9; --surface-2:#f0e9da; --ink:#1b2340; --muted:#676c80; --line:#e3dac7;
  --side:#1d3fae; --side-ink:#eef2ff; --side-muted:#b9c6f2; --side-active:#ffffff22;
  --orange:#e8740f; --orange-ink:#ffffff; --orange-soft:#fde4c8; --orange-mute:#f3c493;
  --cobalt:#1d3fae; --blue-soft:#e1e7fa;
  --green:#1d8048; --green-soft:#d9efe0; --amber:#a86f00; --amber-soft:#f8ebc6; --red:#b8392a; --red-soft:#f7dcd5;
  --shadow:0 1px 2px #1b234012, 0 6px 20px #1b23400d;
  --f-display:"DM Serif Display", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1428; --surface:#171f3d; --surface-2:#1e284c; --ink:#edf0f8; --muted:#a2a9c4; --line:#2a3561;
  --side:#13267a; --side-ink:#eef2ff; --side-muted:#a9b8ec; --side-active:#ffffff1f;
  --orange:#f5963a; --orange-ink:#1b1206; --orange-soft:#3b2814; --orange-mute:#7a4e22;
  --cobalt:#8ba3f5; --blue-soft:#1d2b5e;
  --green:#5cc98a; --green-soft:#14352a; --amber:#e8b84a; --amber-soft:#3a2f12; --red:#f08270; --red-soft:#3d1d19;
  --shadow:0 1px 2px #0006, 0 6px 20px #0004; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1428; --surface:#171f3d; --surface-2:#1e284c; --ink:#edf0f8; --muted:#a2a9c4; --line:#2a3561;
  --side:#13267a; --side-ink:#eef2ff; --side-muted:#a9b8ec; --side-active:#ffffff1f;
  --orange:#f5963a; --orange-ink:#1b1206; --orange-soft:#3b2814; --orange-mute:#7a4e22;
  --cobalt:#8ba3f5; --blue-soft:#1d2b5e;
  --green:#5cc98a; --green-soft:#14352a; --amber:#e8b84a; --amber-soft:#3a2f12; --red:#f08270; --red-soft:#3d1d19;
  --shadow:0 1px 2px #0006, 0 6px 20px #0004; color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.005em}
.num,td.n,.kpi .v{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding-block:24px 0;padding-left:max(14px, env(safe-area-inset-left, 0px));padding-right:14px;overflow:hidden}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px 22px}
.brand svg{flex:none}
.brand b{display:block;font-family:var(--f-display);font-size:22px;line-height:1.1;font-weight:400}
.brand small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--side-muted);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;color:var(--side-ink);text-decoration:none;font-weight:500;font-size:15px}
.nav a:hover{background:#ffffff14}
.nav a.on{background:var(--orange);color:var(--orange-ink);box-shadow:0 4px 14px #0003}
.nav svg{width:21px;height:21px;flex:none}
.tiles{margin-top:auto;height:150px;margin-left:calc(-1 * max(14px, env(safe-area-inset-left, 0px)));margin-right:-14px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23f4efe4'/><g fill='%231d3fae'><path d='M32 7c6 8 6 17 0 25c-6-8-6-17 0-25z'/><path d='M32 57c6-8 6-17 0-25c-6 8-6 17 0 25z'/><path d='M7 32c8-6 17-6 25 0c-8 6-17 6-25 0z'/><path d='M57 32c-8-6-17-6-25 0c8 6 17 6 25 0z'/></g><circle cx='32' cy='32' r='4.5' fill='%23e8740f'/><g fill='%23e8740f'><path d='M0 0h11A11 11 0 0 1 0 11z'/><path d='M64 0v11A11 11 0 0 1 53 0z'/><path d='M0 64V53A11 11 0 0 1 11 64z'/><path d='M64 64H53A11 11 0 0 1 64 53z'/></g><g fill='%231d3fae' opacity='.55'><circle cx='16' cy='16' r='2'/><circle cx='48' cy='16' r='2'/><circle cx='16' cy='48' r='2'/><circle cx='48' cy='48' r='2'/></g></svg>");
  background-size:64px 64px;-webkit-mask-image:linear-gradient(to top,#000 40%,transparent);mask-image:linear-gradient(to top,#000 40%,transparent);opacity:.95}

main{min-width:0;padding-block:26px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.head h1{font-size:clamp(30px,4vw,42px);line-height:1.05}
.head p{margin:4px 0 0;color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:10px}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:11px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--orange)}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--orange);border-color:var(--orange);color:var(--orange-ink);box-shadow:0 4px 14px #e8740f40}
.btn.pri:hover{filter:brightness(1.05)}
.btn.blue{background:var(--side);border-color:var(--side);color:#fff}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.ib{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted)}
.ib:hover{background:var(--surface-2);color:var(--ink)}
.ib svg{width:17px;height:17px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;min-width:0}
.card h2{font-size:22px}
.card .ch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card .sub{color:var(--muted);font-size:13px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpi{border-radius:var(--r);padding:18px;display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);background:var(--surface);min-width:0}
.kpi .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none}
.kpi .ic svg{width:22px;height:22px}
.kpi .l{font-size:13.5px;color:var(--muted);font-weight:500}
.kpi .v{font-family:var(--f-display);font-size:30px;line-height:1.1;margin-top:2px;overflow-wrap:anywhere}
.kpi .t{font-size:12.5px;color:var(--muted);margin-top:4px}
.k-or{background:var(--orange-soft);border-color:transparent}.k-or .ic{background:var(--orange);color:var(--orange-ink)}
.k-gr{background:var(--green-soft);border-color:transparent}.k-gr .ic{background:var(--green);color:var(--surface)}
.k-bl{background:var(--blue-soft);border-color:transparent}.k-bl .ic{background:var(--cobalt);color:var(--surface)}
.k-am{background:var(--amber-soft);border-color:transparent}.k-am .ic{background:var(--amber);color:var(--surface)}
.up{color:var(--green);font-weight:700}.down{color:var(--red);font-weight:700}

.hero{position:relative;border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px}
.hero .txt{padding:26px 28px;display:flex;flex-direction:column;gap:10px}
.hero h1{font-size:clamp(32px,4.4vw,48px);line-height:1.02}
.hero .date{color:var(--muted);font-size:16px}
.hero .art{align-self:stretch;width:340px;position:relative}
.hero .art svg{position:absolute;right:0;bottom:0;height:100%;width:auto}
.script{font-family:var(--f-display);font-style:italic;color:var(--cobalt)}

.grid-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.grid-2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}

.tbl{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 10px;background:var(--surface-2);white-space:nowrap}
th:first-child{border-radius:9px 0 0 9px}th:last-child{border-radius:0 9px 9px 0}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
td.act{white-space:nowrap;text-align:right;width:1%}
.prod{display:flex;align-items:center;gap:10px;font-weight:600}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.c0{background:var(--orange-soft);color:var(--orange)}.c1{background:var(--blue-soft);color:var(--cobalt)}.c2{background:var(--green-soft);color:var(--green)}
.c3{background:var(--amber-soft);color:var(--amber)}.c4{background:var(--red-soft);color:var(--red)}.c5{background:var(--surface-2);color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap;border:0}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{background:var(--green-soft);color:var(--green)}.p-warn{background:var(--amber-soft);color:var(--amber)}.p-bad{background:var(--red-soft);color:var(--red)}.p-info{background:var(--blue-soft);color:var(--cobalt)}
button.pill{cursor:pointer}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.tag.in{background:var(--green-soft);color:var(--green)}.tag.out{background:var(--red-soft);color:var(--red)}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:99px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--side);border-color:var(--side);color:#fff}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;width:max-content;max-width:100%;overflow-x:auto}
.tab{border:0;background:transparent;padding:8px 16px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 12px;min-width:0;flex:1 1 220px;max-width:420px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;background:transparent;padding:10px 0;outline:none;width:100%;min-width:0}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .grow span{font-size:12.5px;color:var(--muted)}
.li .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.li .r small{display:block;color:var(--muted);font-size:12px}
.empty{color:var(--muted);text-align:center;padding:28px 10px;font-size:14px}

.note{display:flex;gap:12px;align-items:center;background:var(--green-soft);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:14px}
.note svg{width:22px;height:22px;color:var(--green);flex:none}

.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--blue-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px}
.banner b{color:var(--cobalt)}

/* Caja */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.mi{border:1px solid var(--line);background:var(--surface);border-radius:13px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:104px;transition:transform .12s,border-color .12s}
.mi:hover{border-color:var(--orange);transform:translateY(-1px)}
.mi:active{transform:scale(.98)}
.mi b{font-weight:600;line-height:1.25}
.mi .pr{margin-top:auto;font-family:var(--f-display);font-size:20px;color:var(--orange)}
.ticket{position:sticky;top:16px}
.tl{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line)}
.tl .grow{flex:1;min-width:0}
.tl .grow b{display:block;font-weight:600;font-size:14px}
.tl .grow span{font-size:12.5px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:700;line-height:1}
.qty span{min-width:22px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.ttot{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px}
.ttot .v{font-family:var(--f-display);font-size:34px}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.pay button{padding:12px 6px;border-radius:11px;border:0;background:var(--orange);color:var(--orange-ink);font-weight:700;cursor:pointer}
.pay button:disabled{opacity:.4;cursor:not-allowed}
.pay button:hover:not(:disabled){filter:brightness(1.06)}

/* Proveedores */
.provs{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.prov dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;margin:12px 0 0;font-size:14px}
.prov dt{color:var(--muted)}
.prov dd{margin:0;overflow-wrap:anywhere}
.prov .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}

/* Barras horizontales */
.hb{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px;padding:6px 0}
.hb .bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.hb .bar i{display:block;height:100%;border-radius:99px;background:var(--cobalt)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-family:var(--f-body);font-size:12px}

/* Formularios */
.form{display:flex;flex-direction:column;gap:14px}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.f input,.f select,.f textarea,.l-row input,.l-row select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 11px;font-weight:500;color:var(--ink);width:100%;min-width:0}
.f input:focus,.f select:focus,.f textarea:focus,.l-row input:focus,.l-row select:focus{border-color:var(--orange);outline:none}
.ferr{color:var(--red);font-size:13.5px;font-weight:600;min-height:1em}
.l-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,.8fr) minmax(0,1fr) minmax(0,.8fr) 32px;gap:8px;align-items:center}
.l-head{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sumbox{background:var(--surface-2);border-radius:11px;padding:12px 14px;display:flex;gap:20px;justify-content:flex-end;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.sumbox b{font-size:17px}

.modal{position:fixed;inset:0;background:#0b1024a6;display:grid;place-items:center;z-index:50;padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.sheet{background:var(--surface);border-radius:18px;width:min(560px,100%);max-height:100%;overflow:auto;padding:22px;box-shadow:0 20px 60px #0005}
.sheet.wide{width:min(820px,100%)}
.sheet .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
.sheet h3{font-size:24px}
.mf{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:60;box-shadow:0 10px 30px #0004;max-width:calc(100% - 32px)}

.r-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) 34px 32px;gap:8px;align-items:center}
.r-u{font-size:13px;color:var(--muted);font-weight:600}
.guide{display:flex;flex-direction:column;gap:16px;max-width:900px}
.toc{position:sticky;top:12px;z-index:2}
.gs{scroll-margin-top:110px;display:flex;flex-direction:column;gap:12px}
.gs h2{font-size:28px}
.gs p{margin:0;max-width:68ch}
.steps{margin:0;padding:0;list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:10px;max-width:72ch}
.steps li{counter-increment:st;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start}
.steps li::before{content:counter(st);width:28px;height:28px;border-radius:50%;background:var(--side);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.dots{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.tip{background:var(--orange-soft);border-radius:11px;padding:11px 14px;font-size:14px;max-width:72ch}
.flow{display:flex;flex-wrap:wrap;gap:8px}
.flow span{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:99px;padding:6px 14px 6px 6px;font-weight:600;font-size:14px}
.flow b{width:24px;height:24px;border-radius:50%;background:var(--orange);color:var(--orange-ink);display:grid;place-items:center;font-size:12px}
.faq{margin:0;display:flex;flex-direction:column;gap:4px}
.faq dt{font-weight:700;margin-top:8px}.faq dd{margin:0;color:var(--muted)}
@media (max-width:860px){.toc{position:static}}
.credit{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;margin-top:12px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.credit b{color:var(--ink);font-weight:600}
.gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:auto;background:var(--side);

  o.settings=Object.assign(defSettings(),o.settings||{});o.carta.forEach(c=>c.receta=c.receta||[]);o.v=2;S=o;return}}}catch(e){}S=seed();save()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ===================== Recetas y consumo ===================== */
const rUnit=u=>u==='kg'?'g':u==='L'?'ml':u;
const rFac=u=>(u==='kg'||u==='L')?1000:1;
const r4=n=>Math.round(n*10000)/10000;
function consumo(items){const m={};items.forEach(it=>{const c=S.carta.find(x=>x.id===it.cid);if(!c||!c.receta)return;c.receta.forEach(r=>{m[r.insumoId]=(m[r.insumoId]||0)+r.cant*it.cant})});
  return Object.entries(m).map(([insumoId,cant])=>({insumoId,cant:r4(cant)}))}
function movVentas(v,sign){(v.consumo||[]).forEach(u=>{const i=S.insumos.find(x=>x.id===u.insumoId);if(!i)return;
  let m=S.movimientos.find(x=>x.fecha===v.fecha&&x.insumoId===u.insumoId&&x.motivo==='Ventas del día');
  if(sign>0){if(m){m.cant=r4(m.cant+u.cant);if(v.hora>m.hora)m.hora=v.hora}else S.movimientos.push({id:uid(),fecha:v.fecha,hora:v.hora,insumoId:i.id,nombre:i.nombre,tipo:'salida',cant:u.cant,motivo:'Ventas del día'})}
  else if(m){m.cant=r4(m.cant-u.cant);if(m.cant<=0)S.movimientos=S.movimientos.filter(x=>x!==m)}})}
const costeRacion=c=>sum(c.receta||[],r=>{const i=S.insumos.find(x=>x.id===r.insumoId);return i?r.cant*i.coste:0});

/* ===================== Cálculos ===================== */
const vTot=v=>sum(v.items,i=>i.cant*i.precio);
const vIva=v=>sum(v.items,i=>i.cant*i.precio*i.iva/(100+i.iva));
const eBase=e=>sum(e.lineas,l=>l.cant*l.coste);
const eIva=e=>sum(e.lineas,l=>l.cant*l.coste*l.iva/100);
const gIva=g=>g.base*g.iva/100;
const provName=id=>(S.proveedores.find(p=>p.id===id)||{}).nombre||'Sin proveedor';
function per(key){const t=today(),d=new Date(t+'T12:00:00'),Y=d.getFullYear(),M=d.getMonth();
  if(key==='hoy')return[t,t];
  if(key==='semana'){const w=(d.getDay()+6)%7;return[addDays(t,-w),t]}
  if(key==='mes')return[Y+'-'+pad(M+1)+'-01',t];
  if(key==='anterior'){const a=new Date(Y,M-1,1),b=new Date(Y,M,0);return[iso(a),iso(b)]}
  if(key==='trimestre'){const q=Math.floor(M/3)*3;return[Y+'-'+pad(q+1)+'-01',t]}
  return[Y+'-01-01',t]}
function totals(a,b){
  const vs=S.ventas.filter(v=>inR(v.fecha,a,b)), es=S.entradas.filter(e=>inR(e.fecha,a,b)), gs=S.gastos.filter(g=>inR(g.fecha,a,b));
  const ventas=sum(vs,vTot), ivaR=sum(vs,vIva), compras=sum(es,eBase), ivaC=sum(es,eIva), gastos=sum(gs,g=>g.base), ivaG=sum(gs,gIva);
  const ingresos=ventas-ivaR, benef=ingresos-compras-gastos;
  return {vs,es,gs,tickets:vs.length,ventas,ivaR,ingresos,compras,ivaC,gastos,ivaG,ivaS:ivaC+ivaG,benef,margen:ingresos?benef/ingresos*100:0};
}
const stState=i=>i.stock<=0?['Agotado','p-bad']:i.stock<i.min?['Stock bajo','p-warn']:['Disponible','p-ok'];

/* ===================== Gráficos ===================== */
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1))),m=x/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p}
function axis(max,W,H,L,R,T,B){const step=niceStep(max/4),top=Math.max(step,Math.ceil(max/step)*step);let s='';
  for(let v=0;v<=top+1e-9;v+=step){const y=T+(H-T-B)*(1-v/top);s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y+4}" text-anchor="end">${v>=1000?grp(String(Math.round(v))):Math.round(v)}</text>`}
  return{top,s}}
function barChart(rows,{h=230,label='€'}={}){
  const W=620,H=h,L=52,R=8,T=18,B=30,max=Math.max(1,...rows.map(r=>r.v)),{top,s}=axis(max,W,H,L,R,T,B),cw=(W-L-R)/rows.length,bw=Math.min(48,cw*.62);
  let o=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de barras">${s}`;
  rows.forEach((r,i)=>{const x=L+cw*i+(cw-bw)/2,bh=(H-T-B)*r.v/top,y=H-B-bh;
    o+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(0,bh)}" rx="7" fill="${r.hl?'var(--orange)':'var(--orange-mute)'}"><title>${esc(r.t||r.l)}: ${eur(r.v)}</title></rect>`;
    if(r.hl)o+=`<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" style="fill:var(--ink);font-weight:700">${eur0(r.v)}</text>`;
    o+=`<text x="${x+bw/2}" y="${H-10}" text-anchor="middle">${esc(r.l)}</text>`});
  return o+'</svg>'}
function groupChart(rows){
  const W=620,H=250,L=56,R=8,T=14,B=30,max=Math.max(1,...rows.flatMap(r=>[r.a,r.b])),{top,s}=axis(max,W,H,L,R,T,B),cw=(W-L-R)/rows.length,bw=Math.min(26,cw*.3);
  let o=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos frente a gastos por mes">${s}`;
  rows.forEach((r,i)=>{const cx=L+cw*i+cw/2;[[r.a,'var(--orange)',-bw-2],[r.b,'var(--cobalt)',2]].forEach(([v,c,dx])=>{const bh=(H-T-B)*v/top;
    o+=`<rect x="${cx+dx}" y="${H-B-bh}" width="${bw}" height="${Math.max(0,bh)}" rx="5" fill="${c}"><title>${eur(v)}</title></rect>`});
    o+=`<text x="${cx}" y="${H-10}" text-anchor="middle">${esc(r.l)}</text>`});
  return o+'</svg>'}

   ${qs.map(x=>`<tr><td><b>${x.q}T</b> <span class="sub">${MES_C[(x.q-1)*3]}–${MES_C[(x.q-1)*3+2]}</span></td><td class="n">${eur(x.r)}</td><td class="n">${eur(x.s)}</td><td class="n"><b>${eur(Math.abs(x.res))}</b></td><td><span class="pill ${x.res>=0?'p-warn':'p-ok'}">${x.res>=0?'A ingresar':'A compensar'}</span></td></tr>`).join('')}

};

   ['ol',['Abre <b>Ventas</b> → pestaña <b>Carta y precios</b> → <b>Nuevo producto</b>.','Escribe el nombre, la categoría y el <b>precio de venta con IVA incluido</b> (el que ve el cliente).','En <b>Receta</b>, pulsa <b>Añadir ingrediente</b> por cada ingrediente y escribe la cantidad de <b>una</b> unidad.','Abajo verás el coste por unidad, el margen y el porcentaje de coste. Guarda.']],
   ['table'],['tip','Un porcentaje de coste por debajo del 35 % (en verde) es saludable. Si sale en rojo, revisa el precio o la receta.'],['tip','Los productos sin receta se venden igual, pero no descuentan nada del inventario.']]],
 ['g-caja','Día a día','Cobrar en caja',[['ol',['Abre <b>Ventas</b> → pestaña <b>Caja</b>.','Toca los productos que pide el cliente. Cada toque suma una unidad al ticket. Usa <b>+</b> y <b>−</b> para corregir.','Comprueba el total y pulsa el método de pago: <b>Efectivo</b>, <b>Tarjeta</b> o <b>Bizum</b>.','La venta queda guardada y los ingredientes de las recetas se descuentan del inventario. Si algo baja del mínimo, verás un aviso.']],
   ['p','En <b>Historial de ventas</b> puedes consultar cualquier día o periodo, ver el total por método de pago (útil para el cierre de caja) y el IVA repercutido.'],
   ['tip','Si cobraste algo por error, bórralo en el Historial: la venta desaparece y los ingredientes vuelven al inventario.']]],
 ['g-recepcion','Día a día','Recibir mercancía',[['ol',['Cuando llegue un pedido, abre <b>Recepción de mercancías</b> → <b>Registrar entrada</b>.','Elige la fecha, el proveedor y escribe el número de albarán.','Añade una línea por producto: producto, cantidad, precio sin IVA e IVA. El precio se rellena con el último que pagaste.','Elige el estado: <b>Recibido</b>, <b>Pendiente de pago</b> o <b>Pagado</b>, y guarda.']],
   ['p','El stock sube automáticamente y el precio de compra del producto se actualiza. Para cambiar el estado más tarde, toca la etiqueta de estado en la tabla.']]],
 ['g-salidas','Día a día','Salidas, mermas y recuento',[['p','Usa <b>Registrar salida</b> en Inventario para lo que se gasta sin pasar por caja: producto caducado o roto, consumo del personal, invitaciones.'],
   ['ol',['Pulsa <b>Registrar salida</b> (o el botón <b>Salida</b> de la fila).','Elige producto, cantidad, fecha y motivo. Guarda.']],
   ['p','<b>Recuento.</b> Una vez a la semana cuenta el almacén. Si el número real no coincide, pulsa el lápiz del producto y corrige el stock: queda registrado como «Ajuste de inventario».']]],
 ['g-gastos','Día a día','Registrar gastos',[['p','Aquí van los gastos que <b>no son mercancía</b>: alquiler, luz, agua, gas, nóminas, seguros sociales, gestoría, teléfono, reparaciones.'],
   ['ol',['Abre <b>Gastos</b> → <b>Añadir gasto</b>.','Escribe la fecha, la categoría y el concepto.','Escribe la <b>base imponible</b> (el importe sin IVA de la factura) y elige el IVA. El total se calcula solo.','Elige cómo lo pagaste y guarda.']],
   ['tip','Las nóminas y los seguros sociales no llevan IVA: elige 0 %. Las compras a proveedores no se apuntan aquí, sino en Recepción de mercancías, para no contarlas dos veces.']]],
 ['g-informes','Control','Leer los informes',[['ul',['<b>Ingresos</b>: lo vendido sin IVA.','<b>Compras</b>: la mercancía recibida, sin IVA.','<b>Gastos</b>: el resto de gastos, sin IVA.','<b>Beneficio neto</b> = ingresos − compras − gastos.','<b>Margen</b>: qué parte de cada euro vendido es beneficio.']],
   ['p','La tabla <b>IVA trimestral</b> compara el IVA que cobras a los clientes (repercutido) con el que pagas a proveedores y en gastos (soportado). Si sale «A ingresar», es lo que previsiblemente tendrás que pagar a Hacienda en la declaración trimestral (Modelo 303 en España).'],
   ['tip','Los informes son una ayuda para controlar el negocio. Las declaraciones oficiales confírmalas siempre con tu gestoría o asesor.']]],
 ['g-copias','Seguridad','Copias de seguridad',[['ol',['Abre <b>Configuración</b> → <b>Descargar copia</b>. Se guarda un archivo con todos tus datos.','Guárdalo en un lugar seguro (correo, nube, memoria USB). Hazlo al menos una vez por semana.','Para recuperar los datos o pasarlos a otro dispositivo, abre la aplicación allí y pulsa <b>Restaurar copia</b>.']],
   ['tip','Si borras el historial o los datos del navegador, la información se pierde. Con una copia reciente la recuperas en un minuto.']]],
 ['g-faq','Dudas','Preguntas frecuentes',[['faq',[['¿Puedo usarla en el móvil?','Sí. El menú pasa arriba y todo se adapta a la pantalla. Recuerda que los datos son de cada dispositivo.'],
   ['Vendo un producto que no lleva receta, ¿pasa algo?','No. Se cobra normalmente; solo no descuenta ingredientes.'],['Cambié el precio de un producto. ¿Afecta a las ventas antiguas?','No. Cada venta guarda el precio con el que se cobró.'],
   ['Cambié una receta. ¿Se recalcula el inventario pasado?','No. La nueva receta se aplica a las ventas desde ese momento.'],['El stock sale distinto del real.','Suele deberse a mermas no registradas o a recetas con cantidades diferentes a las reales. Corrige el stock con el lápiz y ajusta las recetas.'],
   ['Trabajo en otro país.','Escribe tu país y tus tipos de IVA en Configuración. La moneda de la aplicación es el euro.']]]]]
 ]},
en:{eb:'Help',title:'User guide',sub:'Everything you need to set up your café’s bookkeeping, step by step. The app itself is in Spanish, so button names are shown in Spanish.',toc:'Contents',tip:'Tip.',tblH:['Product','Suggested recipe'],
 s:[
 ['g-inicio','Introduction','Before you start',[['p','This app keeps the day-to-day books of a café: what you sell, what you buy, what is in stock, what you spend and what you earn. Everything is calculated from what you record.'],
   ['p','Setup is done <b>only once</b> and takes about 30–60 minutes. Follow steps 1 to 5 in order. After that, daily work is just ringing up sales, recording deliveries and entering expenses.'],
   ['flow',['Business details','Inventory','Suppliers','Menu and recipes','Daily work']],
   ['tip','Data is saved in the browser of the device you use. Always work on the same computer or tablet and make a backup every week (see “Backups”).']]],
 ['g-negocio','Step 1','Business details',[['ol',['Open <b>Configuración</b> (Settings) in the menu.','Enter your café’s name, tax ID (NIF/CIF), address, city and country. The name will appear at the top of the menu.',
   'Under <b>Impuestos</b> (Taxes), check the VAT rates. Spain’s rates come preset (21, 10, 4 and 0 %). If you work in another country, type your own, separated by commas.','Choose the <b>IVA por defecto para la carta</b> (default VAT for menu items). In Spain, hospitality uses 10 %.','Press <b>Guardar cambios</b> (Save changes).']]]],
 ['g-ejemplo','Step 2','Remove the sample data',[['p','The first time you open the app you will see a fictional café with sample sales, purchases and expenses. They show how everything works.'],
   ['ol',['When you are ready, press <b>Empezar desde cero</b> (Start from scratch) in the blue notice or in Configuración → Datos.','Confirm. Everything is deleted except your business details.']],
   ['tip','To see the samples again, use “Cargar datos de ejemplo” (Load sample data) in Configuración. Careful: it replaces your current data.']]],
 ['g-inventario','Step 3','Set up your inventory',[['p','The inventory is the <b>ingredients and goods you buy</b>: coffee beans, milk, cream, sugar, bread, beer, cups… It is not the menu.'],
   ['ol',['Open <b>Inventario</b> (Inventory) and press <b>Nuevo producto</b> (New product).','Enter the name and category (Lácteos = dairy, Panadería = bakery, Bebidas = drinks…).','Choose the <b>unit</b> you buy in: <b>kg</b> for coffee, sugar or ham; <b>L</b> for milk, cream or beer; <b>uds</b> (units) for croissants, bottles or cups.',
    '<b>Stock actual</b> (current stock): what you have today. Count your stock on day one.','<b>Stock mínimo</b> (minimum stock): below this amount the app warns you to reorder.',
    '<b>Purchase price without VAT</b> and <b>purchase VAT</b> (in Spain: milk, bread and fruit 4 %; coffee, cream or pastries 10 %; beer, wine and cups 21 %).','Press <b>Guardar</b> (Save) and repeat for each product.']],
   ['tip','With kg or L as the unit, you can write grams and millilitres in recipes. The app converts automatically.']]],
 ['g-proveedores','Step 4','Suppliers',[['ol',['Open <b>Proveedores</b> (Suppliers) and press <b>Nuevo proveedor</b> (New supplier).','Fill in name, tax ID, phone, email, address and what they supply.','Save. Each card shows this month’s purchases, unpaid amounts and delivery history.']]]],
 ['g-carta','Step 5','Menu, prices and recipes',[['p','The menu (<b>carta</b>) is what you sell at the counter. The <b>recipe</b> (<b>receta</b>) tells the app which ingredients are used for one item, so they are deducted from stock automatically.'],
   ['ol',['Open <b>Ventas</b> (Sales) → <b>Carta y precios</b> tab → <b>Nuevo producto</b>.','Enter the name, category and the <b>selling price including VAT</b> (what the customer pays).','Under <b>Receta</b>, press <b>Añadir ingrediente</b> (Add ingredient) for each ingredient and enter the amount for <b>one</b> item.','Below you will see the cost per item, the margin and the cost percentage. Save.']],
   ['table'],['tip','A cost percentage under 35 % (green) is healthy. If it shows red, check the price or the recipe.'],['tip','Items without a recipe can still be sold; they simply don’t deduct anything from stock.']]],
 ['g-caja','Daily work','Ringing up sales',[['ol',['Open <b>Ventas</b> → <b>Caja</b> (Till) tab.','Tap the items the customer orders. Each tap adds one unit to the ticket. Use <b>+</b> and <b>−</b> to correct.','Check the total and tap the payment method: <b>Efectivo</b> (cash), <b>Tarjeta</b> (card) or <b>Bizum</b>.','The sale is saved and recipe ingredients are deducted from stock. If something falls below its minimum, you will see a warning.']],
   ['p','In <b>Historial de ventas</b> (Sales history) you can view any day or period, totals by payment method (handy for closing the till) and output VAT.'],
   ['tip','If you rang something up by mistake, delete it in the history: the sale disappears and the ingredients go back into stock.']]],
 ['g-recepcion','Daily work','Receiving deliveries',[['ol',['When an order arrives, open <b>Recepción de mercancías</b> (Goods received) → <b>Registrar entrada</b> (Record delivery).','Choose the date and supplier and enter the delivery note number (albarán).','Add one line per product: product, quantity, price without VAT and VAT. The price fills in with the last one you paid.','Choose the status: <b>Recibido</b> (received), <b>Pendiente de pago</b> (unpaid) or <b>Pagado</b> (paid), and save.']],
   ['p','Stock goes up automatically and the product’s purchase price is updated. To change the status later, tap the status label in the table.']]],
 ['g-salidas','Daily work','Write-offs, waste and stock counts',[['p','Use <b>Registrar salida</b> (Record write-off) in Inventario for anything used without going through the till: expired or broken goods, staff consumption, items on the house.'],
   ['ol',['Press <b>Registrar salida</b> (or the <b>Salida</b> button on the row).','Choose product, quantity, date and reason. Save.']],
   ['p','<b>Stock count.</b> Count the storeroom once a week. If the real number is different, press the pencil on the product and correct the stock; it is recorded as an inventory adjustment.']]],
 ['g-gastos','Daily work','Recording expenses',[['p','This is for expenses that <b>are not goods</b>: rent, electricity, water, gas, wages, social security, accountant, phone, repairs.'],
   ['ol',['Open <b>Gastos</b> (Expenses) → <b>Añadir gasto</b> (Add expense).','Enter the date, category and description.','Enter the <b>base imponible</b> (invoice amount without VAT) and choose the VAT. The total is calculated for you.','Choose how you paid and save.']],
   ['tip','Wages and social security have no VAT: choose 0 %. Supplier purchases are not entered here but in Recepción de mercancías, so they are not counted twice.']]],
 ['g-informes','Control','Reading the reports',[['ul',['<b>Ingresos</b> (income): sales without VAT.','<b>Compras</b> (purchases): goods received, without VAT.','<b>Gastos</b> (expenses): other expenses, without VAT.','<b>Beneficio neto</b> (net profit) = income − purchases − expenses.','<b>Margen</b> (margin): how much of each euro sold is profit.']],
   ['p','The <b>IVA trimestral</b> (quarterly VAT) table compares the VAT you charge customers with the VAT you pay suppliers and on expenses. “A ingresar” is roughly what you will owe the tax office in the quarterly return (Modelo 303 in Spain).'],
   ['tip','Reports help you run the business. Always confirm official tax returns with your accountant.']]],
 ['g-copias','Safety','Backups',[['ol',['Open <b>Configuración</b> → <b>Descargar copia</b> (Download backup). A file with all your data is saved.','Keep it somewhere safe (email, cloud, USB stick). Do it at least once a week.','To recover data or move it to another device, open the app there and press <b>Restaurar copia</b> (Restore backup).']],
   ['tip','If you clear the browser’s history or site data, the information is lost. With a recent backup you get it back in a minute.']]],
 ['g-faq','Questions','Frequently asked questions',[['faq',[['Can I use it on my phone?','Yes. The menu moves to the top and everything fits the screen. Remember that data belongs to each device.'],
   ['I sell an item with no recipe. Is that a problem?','No. It is sold as usual; it just doesn’t deduct ingredients.'],['I changed a price. Does it affect old sales?','No. Each sale keeps the price it was sold at.'],
   ['I changed a recipe. Is past stock recalculated?','No. The new recipe applies to sales from that moment on.'],['Stock doesn’t match reality.','Usually because of unrecorded waste or recipes that differ from real portions. Correct the stock with the pencil and adjust the recipes.'],
   ['I work in another country.','Enter your country and VAT rates in Configuración. The app’s currency is the euro.']]]]]
 ]},
uk:{eb:'Довідка',title:'Інструкція',sub:'Усе, що потрібно, щоб налаштувати облік кав’ярні, крок за кроком. Сам застосунок іспанською, тому назви кнопок подано іспанською.',toc:'Зміст',tip:'Порада.',tblH:['Позиція','Орієнтовний рецепт'],
 s:[
 ['g-inicio','Вступ','Перш ніж почати',[['p','Цей застосунок веде щоденний облік кав’ярні: що ви продаєте, що купуєте, що є на складі, скільки витрачаєте і скільки заробляєте. Усе рахується автоматично з того, що ви вносите.'],
   ['p','Налаштування робиться <b>лише один раз</b> і займає 30–60 хвилин. Виконайте кроки 1–5 по черзі. Далі щоденна робота — це продажі на касі, прийом товару й запис витрат.'],
   ['flow',['Дані закладу','Склад','Постачальники','Меню й рецепти','Щоденна робота']],
   ['tip','Дані зберігаються в браузері пристрою, яким ви користуєтеся. Працюйте завжди на тому самому комп’ютері чи планшеті й щотижня робіть резервну копію (див. «Резервні копії»).']]],
 ['g-negocio','Крок 1','Дані закладу',[['ol',['Відкрийте в меню <b>Configuración</b> (Налаштування).','Впишіть назву кав’ярні, податковий номер (NIF/CIF), адресу, місто й країну. Назва з’явиться вгорі меню.',
   'У блоці <b>Impuestos</b> (Податки) перевірте ставки ПДВ (IVA). Стоять іспанські: 21, 10, 4 і 0 %. Якщо ви працюєте в іншій країні, впишіть свої через кому.','Виберіть <b>IVA por defecto para la carta</b> — ставку за замовчуванням для меню. В Іспанії для закладів харчування це 10 %.','Натисніть <b>Guardar cambios</b> (Зберегти зміни).']]]],
 ['g-ejemplo','Крок 2','Видалення прикладів',[['p','Під час першого відкриття ви побачите вигадану кав’ярню з прикладами продажів, закупівель і витрат. Вони показують, як усе працює.'],
   ['ol',['Коли будете готові, натисніть <b>Empezar desde cero</b> (Почати з нуля) у блакитному повідомленні або в Configuración → Datos.','Підтвердьте. Видаляється все, крім даних закладу.']],
   ['tip','Щоб знову побачити приклади, натисніть «Cargar datos de ejemplo» (Завантажити приклади) у Configuración. Увага: це замінить ваші поточні дані.']]],
 ['g-inventario','Крок 3','Заповнення складу',[['p','Склад — це <b>інгредієнти й товари, які ви купуєте</b>: кава в зернах, молоко, вершки, цукор, хліб, пиво, стаканчики… Це не позиції меню.'],
   ['ol',['Відкрийте <b>Inventario</b> (Склад) і натисніть <b>Nuevo producto</b> (Новий товар).','Впишіть назву й категорію (Lácteos — молочне, Panadería — випічка, Bebidas — напої…).','Виберіть <b>одиницю</b>, в якій купуєте: <b>kg</b> — кава, цукор, шинка; <b>L</b> — молоко, вершки, пиво; <b>uds</b> (штуки) — круасани, пляшки, стаканчики.',
    '<b>Stock actual</b> — скільки товару є сьогодні. Першого дня перерахуйте залишки.','<b>Stock mínimo</b> — мінімальний залишок: нижче цієї кількості застосунок нагадає, що час замовляти.',
    '<b>Ціна закупівлі без ПДВ</b> і <b>ПДВ закупівлі</b> (в Іспанії: молоко, хліб, фрукти — 4 %; кава, вершки, випічка — 10 %; пиво, вино, стаканчики — 21 %).','Натисніть <b>Guardar</b> (Зберегти) і повторіть для кожного товару.']],
   ['tip','Якщо одиниця kg або L, у рецептах можна писати грами й мілілітри. Застосунок перерахує сам.']]],
 ['g-proveedores','Крок 4','Постачальники',[['ol',['Відкрийте <b>Proveedores</b> (Постачальники) і натисніть <b>Nuevo proveedor</b> (Новий постачальник).','Заповніть назву, податковий номер, телефон, пошту, адресу й що він постачає.','Збережіть. У картці видно закупівлі за місяць, неоплачені суми й історію накладних.']]]],
 ['g-carta','Крок 5','Меню, ціни й рецепти',[['p','Меню (<b>carta</b>) — це те, що ви продаєте відвідувачам. <b>Рецепт</b> (<b>receta</b>) показує застосунку, які інгредієнти йдуть на одну порцію, щоб автоматично списувати їх зі складу.'],
   ['ol',['Відкрийте <b>Ventas</b> (Продажі) → вкладку <b>Carta y precios</b> → <b>Nuevo producto</b>.','Впишіть назву, категорію й <b>ціну продажу з ПДВ</b> (те, що платить відвідувач).','У блоці <b>Receta</b> натискайте <b>Añadir ingrediente</b> (Додати інгредієнт) для кожного інгредієнта й вписуйте кількість на <b>одну</b> порцію.','Нижче з’являться собівартість порції, маржа й відсоток собівартості. Збережіть.']],
   ['table'],['tip','Собівартість до 35 % від ціни (зелена позначка) — добрий показник. Якщо позначка червона, перегляньте ціну або рецепт.'],['tip','Позиції без рецепта теж продаються, просто нічого не списують зі складу.']]],
 ['g-caja','Щоденна робота','Продаж на касі',[['ol',['Відкрийте <b>Ventas</b> → вкладку <b>Caja</b> (Каса).','Натискайте на позиції, які замовив відвідувач. Кожне натискання додає одну порцію в чек. Кнопками <b>+</b> і <b>−</b> можна виправити кількість.','Перевірте суму й натисніть спосіб оплати: <b>Efectivo</b> (готівка), <b>Tarjeta</b> (картка) або <b>Bizum</b>.','Продаж збережено, інгредієнти з рецептів списано зі складу. Якщо щось опустилося нижче мінімуму, з’явиться попередження.']],
   ['p','В <b>Historial de ventas</b> (Історія продажів) можна переглянути будь-який день чи період, суми за способами оплати (зручно для закриття каси) і нарахований ПДВ.'],
   ['tip','Якщо продаж пробито помилково, видаліть його в історії: продаж зникне, а інгредієнти повернуться на склад.']]],
 ['g-recepcion','Щоденна робота','Прийом товару',[['ol',['Коли привезли замовлення, відкрийте <b>Recepción de mercancías</b> (Прийом товару) → <b>Registrar entrada</b> (Записати надходження).','Виберіть дату, постачальника й впишіть номер накладної (albarán).','Додайте рядок на кожен товар: товар, кількість, ціна без ПДВ і ставка ПДВ. Ціна підставляється з останньої закупівлі.','Виберіть статус: <b>Recibido</b> (отримано), <b>Pendiente de pago</b> (очікує оплати) або <b>Pagado</b> (оплачено) — і збережіть.']],
   ['p','Залишок на складі збільшується автоматично, а ціна закупівлі оновлюється. Щоб змінити статус пізніше, натисніть на позначку статусу в таблиці.']]],
 ['g-salidas','Щоденна робота','Списання, втрати й інвентаризація',[['p','Кнопка <b>Registrar salida</b> (Записати списання) у розділі Inventario — для всього, що витрачено поза касою: прострочений чи пошкоджений товар, харчування персоналу, частування.'],
   ['ol',['Натисніть <b>Registrar salida</b> (або кнопку <b>Salida</b> у рядку товару).','Виберіть товар, кількість, дату й причину. Збережіть.']],

function gLang(){if(UI.glang)return UI.glang;try{const l=localStorage.getItem(KEY+'_guia');if(GUIA[l])return UI.glang=l}catch(e){}return UI.glang='es'}
V.guia=()=>{
  const L=gLang(),G=GUIA[L];
  const blk=b=>{const[k,v]=b;
    if(k==='p')return `<p>${v}</p>`;if(k==='tip')return `<div class="tip"><b>${G.tip}</b> ${v}</div>`;
    if(k==='ol')return `<ol class="steps">${v.map(x=>`<li><span>${x}</span></li>`).join('')}</ol>`;if(k==='ul')return `<ul class="dots">${v.map(x=>`<li>${x}</li>`).join('')}</ul>`;
    if(k==='flow')return `<div class="flow">${v.map((x,i)=>`<span><b>${i+1}</b>${x}</span>`).join('')}</div>`;
    if(k==='faq')return `<dl class="faq">${v.map(([q,a])=>`<dt>${q}</dt><dd>${a}</dd>`).join('')}</dl>`;
    if(k==='table')return `<div class="tbl"><table><thead><tr><th>${G.tblH[0]}</th><th>${G.tblH[1]}</th></tr></thead><tbody>${RECETAS_TBL.map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</tbody></table></div>`;return ''};
  return `<div class="head"><div><div class="eyebrow">${G.eb}</div><h1>${G.title}</h1><p>${G.sub}</p></div>
   <div class="tabs" role="tablist" aria-label="Idioma / Language / Мова">${GLANGS.map(([k,l])=>`<button class="tab ${L===k?'on':''}" data-act="glang" data-id="${k}" role="tab" aria-selected="${L===k}" lang="${k}">${l}</button>`).join('')}</div></div>
  <div class="guide" lang="${L}">
  <nav class="card toc" aria-label="${G.toc}"><div class="eyebrow">${G.toc}</div><div class="chips">${G.s.map(([id,,t],i)=>`<button class="chip" data-act="goto" data-id="${id}">${i>=1&&i<=5?i+'. ':''}${t}</button>`).join('')}</div></nav>
  ${G.s.map(([id,eb,t,body])=>`<section class="card gs" id="${id}"><div class="eyebrow">${eb}</div><h2>${t}</h2>${body.map(blk).join('')}</section>`).join('')}
  </div>`;
};

/* ===================== Render ===================== */
function render(){
  let r=location.hash.slice(1);if(!V[r])r='panel';
  $('#nav').innerHTML=NAV.map(([k,l])=>`<a href="#${k}" class="${k===r?'on':''}" ${k===r?'aria-current="page"':''}>${IC[k]}<span>${l}</span></a>`).join('');
  $('#bname').textContent=S.settings.nombre||'Tu cafetería';
  $('#bsub').textContent='Contabilidad'+(S.settings.ciudad?' · '+S.settings.ciudad:'');
  $('#view').innerHTML=V[r]()+`<footer class="credit"><span>Creado por <b>Halyna Haidai</b> (Галина Гайдай)</span><span>© ${new Date().getFullYear()} ai.lab.creative · Todos los derechos reservados</span></footer>`;
  document.title=(S.settings.nombre?S.settings.nombre+' · ':'')+'Contabilidad Cafetería';
}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});

/* ===================== Modal y avisos ===================== */
let onSub=null;
function modal(title,body,{submit='Guardar',wide=false,danger=false}={},fn){
  $('#mtitle').textContent=title;$('#mbody').innerHTML=body;$('#merr').textContent='';
  const b=$('#msubmit');b.textContent=submit;b.className='btn '+(danger?'danger':'pri');
  $('#mform').classList.toggle('wide',wide);onSub=fn;$('#modal').hidden=false;
  setTimeout(()=>{const f=$('#mbody input:not([type=hidden]),#mbody select');f&&f.focus()},40);
}
function close_(){$('#modal').hidden=true;onSub=null}
function ferr(m){$('#merr').textContent=m;return false}
function confirmar(msg,label,fn){modal('¿Estás seguro?',`<p style="margin:0">${msg}</p>`,{submit:label,danger:true},()=>{fn()})}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}
$('#mform').addEventListener('submit',e=>{e.preventDefault();if(!onSub)return;const fd=Object.fromEntries(new FormData(e.target));if(onSub(fd)!==false){close_();save();render()}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')close_()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)close_()});

const opts=(arr,sel,fmt=x=>x)=>arr.map(x=>`<option value="${esc(x)}" ${String(x)===String(sel)?'selected':''}>${esc(fmt(x))}</option>`).join('');
const ivaSel=(name,sel)=>`<select name="${name}" id="${name}">${opts(ivaOpc(),sel,x=>x+' %')}</select>`;
const dlist=(id,arr)=>`<datalist id="${id}">${[...new Set(arr)].map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;

/* ===================== Formularios ===================== */
function recRow(r={}){const sel=S.insumos.find(x=>x.id===r.insumoId);return `<div class="r-row"><select class="r-ins" aria-label="Ingrediente"><option value="">Elige ingrediente…</option>${S.insumos.map(i=>`<option value="${i.id}" ${r.insumoId===i.id?'selected':''}>${esc(i.nombre)}</option>`).join('')}</select>
  <input class="r-c" inputmode="decimal" placeholder="Cantidad" aria-label="Cantidad por unidad" value="${sel?qn(r.cant*rFac(sel.unidad)):''}"><span class="r-u">${sel?rUnit(sel.unidad):''}</span><button type="button" class="ib" data-act="rmrec" aria-label="Quitar ingrediente">${IC.trash}</button></div>`}
function recCost(){const el=$('#rtot');if(!el)return;let co=0;$$('#recs .r-row').forEach(r=>{const i=S.insumos.find(x=>x.id===r.querySelector('.r-ins').value);if(i)co+=num(r.querySelector('.r-c').value)/rFac(i.unidad)*i.coste});
  const iv=num(($('#mbody select[name=iva]')||{}).value),neto=num($('#f_precio').value)/(1+iv/100),fc=neto?co/neto*100:0;
  el.innerHTML=`<span>Coste por unidad: <b>${eur(co)}</b></span><span>Precio sin IVA: <b>${eur(neto)}</b></span><span>Margen: <b>${eur(neto-co)}</b></span><span>Coste: <b>${neto?pct(fc):'—'}</b></span>`}
function formCarta(c){c=c||{nombre:'',cat:'',precio:'',iva:S.settings.ivaCarta??10,receta:[]};
  modal(c.id?'Editar producto de la carta':'Nuevo producto de la carta',`<div class="form">
   <label class="f">Nombre<input name="nombre" id="f_nombre" value="${esc(c.nombre)}" placeholder="Café con leche"></label>
   <div class="fg"><label class="f">Categoría<input name="cat" id="f_cat" list="dl_cat" value="${esc(c.cat)}" placeholder="Cafés"></label>${dlist('dl_cat',['Cafés','Bebidas','Bollería','Tostadas y bocadillos','Con alcohol',...S.carta.map(x=>x.cat)])}
   <label class="f">IVA${ivaSel('iva',c.iva)}</label></div>
   <label class="f">Precio de venta (IVA incluido)<input name="precio" id="f_precio" inputmode="decimal" value="${c.precio!==''?String(c.precio).replace('.',','):''}" placeholder="1,70"></label>
   <div><b style="font-size:15px">Receta</b><div class="sub">Ingredientes que se gastan al vender <b>una</b> unidad. Por ejemplo, un café con leche: 8 g de café, 150 ml de leche y 7 g de azúcar.</div></div>
   ${S.insumos.length?`<div id="recs" class="form" style="gap:8px">${(c.receta&&c.receta.length?c.receta:[{}]).map(recRow).join('')}</div>
   <div><button type="button" class="btn sm" data-act="addrec">${IC.plus} Añadir ingrediente</button></div><div class="sumbox" id="rtot"></div>`:'<div class="tag">Primero añade ingredientes en Inventario para poder crear la receta.</div>'}</div>`,{wide:true},f=>{
   if(!f.nombre.trim())return ferr('Escribe el nombre del producto.');const p=num(f.precio);if(p<=0)return ferr('Indica un precio mayor que 0.');
   const receta=[];for(const r of $$('#recs .r-row')){const id=r.querySelector('.r-ins').value,q=num(r.querySelector('.r-c').value);if(!id&&!q)continue;
     if(!id)return ferr('Elige el ingrediente en todas las líneas de la receta.');if(q<=0)return ferr('Indica la cantidad de cada ingrediente.');
     const i=S.insumos.find(x=>x.id===id),ex=receta.find(x=>x.insumoId===id),cant=r4(q/rFac(i.unidad));if(ex)ex.cant=r4(ex.cant+cant);else receta.push({insumoId:id,cant})}
   const o={nombre:f.nombre.trim(),cat:f.cat.trim()||'Otros',precio:r2(p),iva:+f.iva,receta};
   if(c.id)Object.assign(S.carta.find(x=>x.id===c.id),o);else S.carta.push({id:uid(),...o});toast('Producto guardado')});recCost()}

function lineRow(l={}){return `<div class="l-row"><select class="l-ins" name="li" aria-label="Producto"><option value="">Elige producto…</option>${S.insumos.map(i=>`<option value="${i.id}" ${l.insumoId===i.id?'selected':''}>${esc(i.nombre)} (${esc(i.unidad)})</option>`).join('')}</select>
  <input class="l-c" inputmode="decimal" placeholder="Cant." aria-label="Cantidad" value="${l.cant??''}"><input class="l-p" inputmode="decimal" placeholder="Precio sin IVA" aria-label="Precio de compra sin IVA" value="${l.coste!=null?String(l.coste).replace('.',','):''}">
  <select class="l-i" aria-label="IVA">${opts(ivaOpc(),l.iva??10,x=>x+' %')}</select><button type="button" class="ib" data-act="rmline" aria-label="Quitar línea">${IC.trash}</button></div>`}
function lineTotals(){let b=0,iv=0;$$('#lines .l-row').forEach(r=>{const c=num(r.querySelector('.l-c').value),p=num(r.querySelector('.l-p').value),i=+r.querySelector('.l-i').value;b+=c*p;iv+=c*p*i/100});
  const el=$('#ltot');if(el)el.innerHTML=`<span>Base: <b>${eur(b)}</b></span><span>IVA: <b>${eur(iv)}</b></span><span>Total: <b>${eur(b+iv)}</b></span>`}
function formEntrada(){
  if(!S.insumos.length){toast('Primero añade productos en Inventario');location.hash='inventario';return}
  modal('Registrar entrada de mercancía',`<div class="form">
   <div class="fg"><label class="f">Fecha de recepción<input type="date" name="fecha" id="e_fecha" value="${today()}"></label>
   <label class="f">Proveedor<select name="prov" id="e_prov"><option value="">— Sin proveedor —</option>${S.proveedores.map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}</select></label></div>
   <div class="fg"><label class="f">Número de albarán<input name="albaran" id="e_alb" placeholder="ALB-0001"></label><label class="f">Estado<select name="estado" id="e_estado">${opts(ESTADOS,'Recibido')}</select></label></div>
   <div class="l-row l-head"><span>Producto</span><span>Cantidad</span><span>Precio sin IVA</span><span>IVA</span><span></span></div>
   <div id="lines" class="form" style="gap:8px">${lineRow()}</div>
   <div><button type="button" class="btn sm" data-act="addline">${IC.plus} Añadir línea</button></div>
   <div class="sumbox" id="ltot"></div></div>`,{wide:true,submit:'Guardar entrada'},f=>{
   const lineas=[];for(const r of $$('#lines .l-row')){const id=r.querySelector('.l-ins').value,c=num(r.querySelector('.l-c').value),p=num(r.querySelector('.l-p').value),iv=+r.querySelector('.l-i').value;
     if(!id&&!c)continue;if(!id)return ferr('Elige el producto en todas las líneas.');if(c<=0)return ferr('Indica una cantidad mayor que 0.');const i=S.insumos.find(x=>x.id===id);lineas.push({insumoId:id,nombre:i.nombre,cant:c,coste:r2(p),iva:iv})}
   if(!lineas.length)return ferr('Añade al menos un producto.');
   const e={id:uid(),fecha:f.fecha||today(),proveedorId:f.prov,albaran:f.albaran.trim()||'S/N',lineas,estado:f.estado};S.entradas.push(e);
   lineas.forEach(l=>{const i=S.insumos.find(x=>x.id===l.insumoId);i.stock=r2(i.stock+l.cant);if(l.coste>0){i.coste=l.coste;i.iva=l.iva}
     S.movimientos.push({id:uid(),fecha:e.fecha,hora:nowTime(),insumoId:i.id,nombre:i.nombre,tipo:'entrada',cant:l.cant,motivo:'Albarán '+e.albaran})});
   toast('Entrada registrada: '+eur(eBase(e)+eIva(e)))});lineTotals()}
function formInsumo(i){i=i||{nombre:'',cat:'',unidad:'kg',stock:0,min:0,coste:'',iva:10};
  modal(i.id?'Editar producto':'Nuevo producto de inventario',`<div class="form">

   if(i.id){const x=S.insumos.find(z=>z.id===i.id),d=o.stock-x.stock;if(d)S.movimientos.push({id:uid(),fecha:today(),hora:nowTime(),insumoId:x.id,nombre:o.nombre,tipo:d>0?'entrada':'salida',cant:Math.abs(d),motivo:'Ajuste de inventario'});Object.assign(x,o)}

   <div class="fg"><label class="f">Cantidad<input name="cant" id="s_cant" inputmode="decimal"></label><label class="f">Fecha<input type="date" name="fecha" id="s_fecha" value="${today()}"></label></div>

   if(!f.concepto.trim())return ferr('Escribe el concepto del gasto.');const b=num(f.base);if(b<=0)return ferr('Indica un importe mayor que 0.');
   const o={fecha:f.fecha||today(),concepto:f.concepto.trim(),cat:f.cat,base:r2(b),iva:+f.iva,pago:f.pago};
   if(g.id)Object.assign(S.gastos.find(x=>x.id===g.id),o);else S.gastos.push({id:uid(),...o});UI.gmes=ym(o.fecha);toast('Gasto guardado')});gastoTot()}
function gastoTot(){const el=$('#gtot');if(!el)return;const b=num($('#g_base').value),i=+$('#iva').value;el.innerHTML=`<span>IVA: <b>${eur(b*i/100)}</b></span><span>Total: <b>${eur(b*(1+i/100))}</b></span>`}
function formProv(p){p=p||{nombre:'',nif:'',tel:'',email:'',dir:'',productos:''};
  modal(p.id?'Editar proveedor':'Nuevo proveedor',`<div class="form"><label class="f">Nombre<input name="nombre" id="p_nombre" value="${esc(p.nombre)}"></label>
   <div class="fg"><label class="f">NIF/CIF<input name="nif" id="p_nif" value="${esc(p.nif)}"></label><label class="f">Teléfono<input name="tel" id="p_tel" inputmode="tel" value="${esc(p.tel)}"></label></div>
   <label class="f">Correo electrónico<input name="email" id="p_email" type="email" value="${esc(p.email)}"></label><label class="f">Dirección<input name="dir" id="p_dir" value="${esc(p.dir)}"></label>
   <label class="f">Productos que suministra<input name="productos" id="p_prod" value="${esc(p.productos)}"></label></div>`,{},f=>{
   if(!f.nombre.trim())return ferr('Escribe el nombre del proveedor.');const o={nombre:f.nombre.trim(),nif:f.nif.trim(),tel:f.tel.trim(),email:f.email.trim(),dir:f.dir.trim(),productos:f.productos.trim()};
   if(p.id)Object.assign(S.proveedores.find(x=>x.id===p.id),o);else S.proveedores.push({id:uid(),...o});toast('Proveedor guardado')})}

/* ===================== Acciones ===================== */
const A={
  close:close_,
  vtab:id=>{UI.vtab=id;render()}, mcat:id=>{UI.mcat=id;render()}, icat:id=>{UI.icat=id;render()}, gmes:id=>{UI.gmes=id;render()}, iper:id=>{UI.iper=id;render()},
  vrange:id=>{[UI.vdesde,UI.vhasta]=per(id);render()},
  addcart:id=>{const c=S.carta.find(x=>x.id===id),l=cart.find(x=>x.cid===id);if(l)l.cant++;else cart.push({cid:id,nombre:c.nombre,cant:1,precio:c.precio,iva:c.iva});render()},
  cplus:id=>{cart.find(x=>x.cid===id).cant++;render()}, cminus:id=>{const l=cart.find(x=>x.cid===id);l.cant--;if(l.cant<=0)cart=cart.filter(x=>x!==l);render()},
  clearcart:()=>{cart=[];render()},
  cobrar:p=>{if(!cart.length)return;const v={id:uid(),fecha:today(),hora:nowTime(),items:cart.map(l=>({...l})),pago:p};v.consumo=consumo(v.items);
    const low=[];v.consumo.forEach(u=>{const i=S.insumos.find(x=>x.id===u.insumoId);if(!i)return;const was=i.stock>=i.min;i.stock=Math.max(0,r4(i.stock-u.cant));if(was&&i.stock<i.min)low.push(i.nombre)});
    movVentas(v,1);S.ventas.push(v);cart=[];save();render();toast(`Venta cobrada (${p}): ${eur(vTot(v))}`+(low.length?` · Stock bajo: ${low.join(', ')}`:''))},
  delventa:id=>confirmar('Se borrará esta venta del historial y los ingredientes de su receta volverán al inventario.','Borrar venta',()=>{const v=S.ventas.find(x=>x.id===id);
    (v.consumo||[]).forEach(u=>{const i=S.insumos.find(x=>x.id===u.insumoId);if(i)i.stock=r4(i.stock+u.cant)});movVentas(v,-1);S.ventas=S.ventas.filter(x=>x.id!==id);toast('Venta borrada')}),
  newcarta:()=>formCarta(), editcarta:id=>formCarta({...S.carta.find(c=>c.id===id)}),
  delcarta:id=>confirmar('Se quitará el producto de la carta. Las ventas ya registradas se mantienen.','Borrar producto',()=>{S.carta=S.carta.filter(c=>c.id!==id);cart=cart.filter(l=>l.cid!==id)}),
  newentrada:()=>formEntrada(),
  addline:()=>{$('#lines').insertAdjacentHTML('beforeend',lineRow());lineTotals()},
  rmline:(id,b)=>{if($$('#lines .l-row').length>1)b.closest('.l-row').remove();lineTotals()},
  estado:id=>{const e=S.entradas.find(x=>x.id===id);e.estado=ESTADOS[(ESTADOS.indexOf(e.estado)+1)%3];save();render()},
  delentrada:id=>confirmar('Se borrará el albarán y se restará su mercancía del inventario.','Borrar entrada',()=>{const e=S.entradas.find(x=>x.id===id);
    e.lineas.forEach(l=>{const i=S.insumos.find(x=>x.id===l.insumoId);if(i)i.stock=Math.max(0,r2(i.stock-l.cant))});S.entradas=S.entradas.filter(x=>x.id!==id);toast('Entrada borrada')}),
  newinsumo:()=>formInsumo(), editinsumo:id=>formInsumo({...S.insumos.find(i=>i.id===id)}), newsalida:id=>formSalida(id),
  delinsumo:id=>confirmar('Se borrará el producto del inventario y se quitará de las recetas donde aparezca.','Borrar producto',()=>{S.insumos=S.insumos.filter(i=>i.id!==id);S.carta.forEach(c=>c.receta=(c.receta||[]).filter(r=>r.insumoId!==id))}),
  addrec:()=>{$('#recs').insertAdjacentHTML('beforeend',recRow());recCost()},
  rmrec:(id,b)=>{b.closest('.r-row').remove();recCost()},
  glang:id=>{UI.glang=id;try{localStorage.setItem(KEY+'_guia',id)}catch(e){}render()},
  goto:id=>{const el=document.getElementById(id);el&&el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})},
  newgasto:()=>formGasto(), editgasto:id=>formGasto({...S.gastos.find(g=>g.id===id)}),
  delgasto:id=>confirmar('Se borrará este gasto.','Borrar gasto',()=>{S.gastos=S.gastos.filter(g=>g.id!==id);toast('Gasto borrado')}),
  newprov:()=>formProv(), editprov:id=>formProv({...S.proveedores.find(p=>p.id===id)}),
  delprov:id=>confirmar('Se borrará el proveedor. Sus albaranes se mantienen como «Sin proveedor».','Borrar proveedor',()=>{S.proveedores=S.proveedores.filter(p=>p.id!==id)}),
  histprov:id=>{const p=S.proveedores.find(x=>x.id===id),es=S.entradas.filter(e=>e.proveedorId===id).sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,30);
    modal('Historial · '+p.nombre,`<div class="tbl"><table><thead><tr><th>Fecha</th><th>Albarán</th><th class="n">Total</th><th>Estado</th></tr></thead><tbody>${es.length?es.map(e=>`<tr><td>${fdate(e.fecha)}</td><td>${esc(e.albaran)}</td><td class="n">${eur(eBase(e)+eIva(e))}</td><td>${e.estado}</td></tr>`).join(''):'<tr><td colspan="4"><div class="empty">Sin compras registradas.</div></td></tr>'}</tbody></table></div>`,{wide:true})},
  startfresh:()=>confirmar('Se borrarán todos los datos (ventas, compras, gastos, inventario y proveedores). Los datos del negocio se mantienen.','Borrar todo y empezar',()=>{const s=S.settings;S=blank();S.settings=s;cart=[];toast('Listo. Empieza añadiendo tu carta y tus productos.')}),
  loadsample:()=>confirmar('Se sustituirán los datos actuales por datos de ejemplo.','Cargar ejemplo',()=>{const s=S.settings;S=seed();S.settings=s;cart=[];toast('Datos de ejemplo cargados')}),
  export:()=>{try{const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='contabilidad-cafeteria-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();toast('Copia descargada')}catch(e){toast('No se pudo descargar. Usa «Copiar copia».')}},
  copyexport:()=>{const t=JSON.stringify(S);navigator.clipboard.writeText(t).then(()=>toast('Copia copiada al portapapeles. Pégala en un archivo de texto.'),()=>toast('No se pudo copiar en este navegador.'))},
  import:()=>$('#fileimp').click()
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;if(A[a]){e.preventDefault();A[a](b.dataset.id,b,e)}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='iq'){const q=t.value.trim().toLowerCase();$$('#itbody tr[data-name]').forEach(r=>r.hidden=q&&!r.dataset.name.includes(q))}
  if(t.closest('#lines'))lineTotals(); if(t.id==='g_base')gastoTot(); if(t.closest('#recs')||t.id==='f_precio')recCost()});
document.addEventListener('change',e=>{const t=e.target;
  if(t.classList.contains('l-ins')){const i=S.insumos.find(x=>x.id===t.value),r=t.closest('.l-row');if(i){r.querySelector('.l-p').value=String(i.coste).replace('.',',');r.querySelector('.l-i').value=i.iva}lineTotals()}
  if(t.classList.contains('l-i'))lineTotals(); if(t.classList.contains('r-ins')){const i=S.insumos.find(x=>x.id===t.value);t.closest('.r-row').querySelector('.r-u').textContent=i?rUnit(i.unidad):'';recCost()} if(t.closest('#mbody')&&t.name==='iva'&&$('#recs'))recCost(); if(t.id==='iva'&&$('#gtot'))gastoTot();
  if(t.id==='vdesde'||t.id==='vhasta'){UI[t.id]=t.value||today();if(UI.vdesde>UI.vhasta)[UI.vdesde,UI.vhasta]=[UI.vhasta,UI.vdesde];render()}});
document.addEventListener('submit',e=>{if(e.target.id!=='cfgform')return;e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
  const ivas=[...new Set(String(f.ivas).split(/[;\s]+|,(?=\s*\d)/).map(x=>num(x)).filter(x=>x>=0&&x<100))].sort((a,b)=>b-a);
  S.settings=Object.assign(S.settings,{nombre:f.nombre.trim(),nif:f.nif.trim(),direccion:f.direccion.trim(),ciudad:f.ciudad.trim(),pais:f.pais.trim(),ivas:ivas.length?ivas:[21,10,4,0],ivaCarta:num(f.ivaCarta)});save();render();toast('Configuración guardada')});
$('#fileimp').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);
  if(!o||!Array.isArray(o.ventas)||!Array.isArray(o.insumos))throw 0;S=o;cart=[];save();render();toast('Copia restaurada')}catch(x){toast('El archivo no es una copia válida de esta aplicación.')}};r.readAsText(f);e.target.value=''});

/* ===================== Licencia (código de acceso, 1 dispositivo) ===================== */
const LICENCIA=true;   // true en la versión publicada (GitHub)
const API_URL='https://script.google.com/macros/s/AKfycbzkA_D82MZt03GQJXRS7hJOs3Y7zwwq8E-kMKNvLRrpmOTIH4yeYUvzIFqANryDAgFv/exec';   // URL /exec de Google Apps Script
const LIC_KEY=KEY+'_licencia', DEV_KEY=KEY+'_dispositivo';
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function deviceId(){let d=lsGet(DEV_KEY);if(!d){d=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'d-'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);lsSet(DEV_KEY,d)}return d}
async function licApi(action,code){const u=API_URL+'?action='+action+'&code='+encodeURIComponent(code)+'&device='+encodeURIComponent(deviceId())+'&t='+Date.now();
  const r=await fetch(u,{redirect:'follow'});return r.json()}
const LIC_ERR={invalid:'Este código no existe. Revisa que esté bien escrito.',used:'Este código ya está activado en otro dispositivo. Si has cambiado de dispositivo, escríbeme y lo libero.',
  blocked:'Este código está desactivado. Escríbeme para más información.',net:'No se pudo conectar. Comprueba tu conexión a internet e inténtalo de nuevo.',empty:'Escribe tu código de acceso.'};
function showGate(start,msg){
  let g=$('#gate');if(!g){g=document.createElement('div');g.id='gate';g.className='gate';document.body.appendChild(g)}
  g.innerHTML=`<form class="gcard" id="gform" novalidate>
    <svg width="64" height="64" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="26" r="17" fill="#f39223"/><circle cx="24" cy="26" r="13" fill="#fbb04a"/><g stroke="#f39223" stroke-width="1.6"><path d="M24 13v26M11 26h26M15 17l18 18M33 17L15 35"/></g><circle cx="24" cy="26" r="2.4" fill="#fff4dc"/><path d="M24 9c2-5 8-7 12-6c-2 5-7 7-12 6z" fill="#3c9a4e"/></svg>
    <div class="eyebrow">Contabilidad Cafetería</div><h1>Activa tu aplicación</h1>
    <p>Introduce el código de acceso que recibiste tras la compra. Cada código funciona en un solo dispositivo.</p>
    <label class="f" for="gcode">Código de acceso</label><input id="gcode" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CAFE-XXXX-XXXX">
    <div class="ferr" id="gerr">${msg||''}</div>
    <button class="btn pri" type="submit" id="gbtn">Activar</button>
    <p class="sub">¿Aún no tienes código? Escríbeme por mensaje privado para conseguir la aplicación.</p>
    <div class="sub">Creado por <b>Halyna Haidai</b> · ai.lab.creative</div></form>`;
  g.hidden=false;setTimeout(()=>$('#gcode').focus(),50);
  $('#gform').addEventListener('submit',async e=>{e.preventDefault();const code=$('#gcode').value.trim().toUpperCase().replace(/\s+/g,'');
    if(!code){$('#gerr').textContent=LIC_ERR.empty;return}
    const b=$('#gbtn');b.disabled=true;b.textContent='Comprobando…';$('#gerr').textContent='';
    try{const r=await licApi('activate',code);
      if(r&&r.ok){lsSet(LIC_KEY,JSON.stringify({code,fecha:today()}));g.hidden=true;g.innerHTML='';start()}
      else{$('#gerr').textContent=LIC_ERR[r&&r.error]||LIC_ERR.invalid;b.disabled=false;b.textContent='Activar'}}
    catch(x){$('#gerr').textContent=LIC_ERR.net;b.disabled=false;b.textContent='Activar'}});
}
function licenseGate(start){
  if(!LICENCIA){start();return}
  let lic=null;try{lic=JSON.parse(lsGet(LIC_KEY)||'null')}catch(e){}
  if(!lic||!lic.code){showGate(start);return}
  start();
  licApi('check',lic.code).then(r=>{if(r&&r.ok===false){lsDel(LIC_KEY);document.querySelector('.app').hidden=true;
    showGate(()=>{document.querySelector('.app').hidden=false;load();render()},r.error==='blocked'?LIC_ERR.blocked:'Tu licencia ya no es válida en este dispositivo. Introduce de nuevo tu código.')}}).catch(()=>{});
}
licenseGate(()=>{load();render()});
